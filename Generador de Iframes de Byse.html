<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de Códigos IFRAME</title>

<style>
body{
  font-family: Arial;
  padding:25px;
  background:#f1f8e9;
  color:#2e7d32;
  max-width:900px;
  margin:auto;
}
textarea,#output,#jsonOutput{
  width:100%;
  height:200px;
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  border:2px solid #4caf50;
  background:#e8f5e9;
  font-family:monospace;
  white-space:pre-wrap;
}
button{
  padding:10px 20px;
  background:#4caf50;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
  margin:5px;
}
</style>
</head>

<body>

<h2>🖥️ Generador de IFRAME</h2>

<textarea id="inputText" placeholder="Pega enlaces aquí..."></textarea>

<button onclick="generar()">Generar</button>
<button onclick="copiar('output')">Copiar Iframes</button>
<button onclick="copiar('jsonOutput')">Copiar JSON</button>

<h3>Resultado IFRAME</h3>
<div id="output"></div>

<h3>Resultado JSON</h3>
<div id="jsonOutput"></div>

<script>
// ---------- DETECTORES ----------
function filemoonID(linea){
  const m=linea.match(/https:\/\/filemoon\.to\/d\/([\w\d]+)/);
  return m?m[1]:null;
}

function bysebuhoID(linea){
  const m=linea.match(/bysebuho\.com\/d\/([\w\d]+)/);
  return m?m[1]:null;
}

// ---------- CONVERSORES ----------
function iframeFilemoon(id){
  return `<iframe src="https://filemoon.to/e/${id}" frameborder="0" marginwidth="0" marginheight="0" scrolling="no" width="800" height="440" allowfullscreen></iframe>`;
}

function iframeBysebuho(id){
  return `<iframe src="https://bysebuho.com/e/${id}" frameborder="0" marginwidth="0" marginheight="0" scrolling="no" width="800" height="440" allowfullscreen></iframe>`;
}

// ---------- PROCESADOR ----------
function generar(){
  const input=document.getElementById('inputText').value.trim();
  if(!input)return;

  const lineas=input.split('\n');
  let iframes=[];
  let json=[];

  lineas.forEach(l=>{
    let id;

    if(id=filemoonID(l)){
      const url=`https://filemoon.to/e/${id}`;
      iframes.push(iframeFilemoon(id));
      json.push(`{ url: "${url}", minutos: 24 }`);
    }

    else if(id=bysebuhoID(l)){
      const url=`https://bysebuho.com/e/${id}`;
      iframes.push(iframeBysebuho(id));
      json.push(`{ url: "${url}", minutos: 24 }`);
    }
  });

  document.getElementById('output').textContent=iframes.join('\n\n');
  document.getElementById('jsonOutput').textContent=json.join(',\n');
}

// ---------- COPIAR ----------
function copiar(id){
  const t=document.getElementById(id).textContent;
  if(!t)return;
  navigator.clipboard.writeText(t);
  alert("Copiado ✔");
}
</script>

</body>
</html>

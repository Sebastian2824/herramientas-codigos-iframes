<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de iFrames - Yape Style</title>
  <link rel="icon" type="image/png" href="../../Image/Logo.png">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f9f0 0%, #e0f2e0 100%);
      padding: 20px;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 128, 0, 0.1);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    
    .header {
      background: linear-gradient(to right, #00a859, #00c853);
      color: white;
      padding: 25px 30px;
      text-align: center;
    }
    
    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .header h1:before {
      content: "▶";
      margin-right: 12px;
      font-size: 24px;
    }
    
    .header p {
      margin: 10px 0 0;
      opacity: 0.9;
      font-size: 16px;
    }
    
    .content {
      padding: 30px;
    }
    
    .input-group {
      margin-bottom: 25px;
    }
    
    .input-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #00a859;
      font-size: 18px;
      display: flex;
      align-items: center;
    }
    
    .input-group label:before {
      content: "📋";
      margin-right: 10px;
    }
    
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      font-family: 'Courier New', Consolas, monospace;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      resize: vertical;
      transition: border 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }
    
    textarea:focus {
      outline: none;
      border-color: #00c853;
      box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.2);
    }
    
    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 50px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    button:before {
      font-size: 18px;
    }
    
    #generarBtn {
      background: linear-gradient(to right, #00a859, #00c853);
      color: white;
      flex: 1;
      min-width: 200px;
    }
    
    #generarBtn:before {
      content: "⚡";
    }
    
    #generarBtn:hover {
      background: linear-gradient(to right, #00914a, #00b347);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 168, 89, 0.3);
    }
    
    #copiarBtn {
      background: white;
      color: #00a859;
      border: 2px solid #00a859;
      flex: 1;
      min-width: 200px;
    }
    
    #copiarBtn:before {
      content: "📄";
    }
    
    #copiarBtn:hover {
      background: #f0fff5;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 168, 89, 0.2);
    }
    
    .result-title {
      color: #00a859;
      font-size: 20px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
    }
    
    .result-title:before {
      content: "✅";
      margin-right: 10px;
    }
    
    #salida {
      background-color: #f9f9f9;
      border: 2px dashed #c0e0c0;
    }
    
    .copiado {
      color: #00a859;
      font-weight: 600;
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #f0fff5;
      border-radius: 10px;
      border-left: 5px solid #00a859;
      display: none;
      align-items: center;
      animation: fadeIn 0.5s;
    }
    
    .copiado:before {
      content: "✓";
      margin-right: 10px;
      font-size: 20px;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #eee;
      background-color: #f9f9f9;
    }
    
    .footer a {
      color: #00a859;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }
      
      .buttons {
        flex-direction: column;
      }
      
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Generador de iFrames</h1>
      <p>Elimina automáticamente las etiquetas DIV y extrae solo los iFrames</p>
    </div>
    
    <div class="content">
      <div class="input-group">
        <label for="entrada">Pega aquí los códigos de incrustación:</label>
        <textarea id="entrada" placeholder="Pega aquí uno o varios códigos con <div> + <iframe>..."></textarea>
      </div>
      
      <div class="buttons">
        <button id="generarBtn" onclick="generar()">Generar iFrames</button>
        <button id="copiarBtn" onclick="copiar()">Copiar resultado</button>
      </div>
      
      <div id="mensaje" class="copiado">✅ Copiado al portapapeles</div>
      
      <h2 class="result-title">Resultado:</h2>
      <textarea id="salida" placeholder="Aquí aparecerán solo los iframes extraídos..." readonly></textarea>
    </div>
    
  </div>

  <script>
    function generar() {
      const entrada = document.getElementById("entrada").value;

      // Extraer TODOS los iframes
      const iframes = entrada.match(/<iframe[\s\S]*?<\/iframe>/gi);

      document.getElementById("salida").value = iframes
        ? iframes.join("\n\n")
        : "No se encontraron iframes.";

      document.getElementById("mensaje").style.display = "none";
    }

    function copiar() {
      const salida = document.getElementById("salida");

      if (!salida.value.trim() || salida.value === "No se encontraron iframes.") {
        return;
      }

      salida.select();
      salida.setSelectionRange(0, 99999); // móviles

      navigator.clipboard.writeText(salida.value).then(() => {
        const msg = document.getElementById("mensaje");
        msg.style.display = "flex";

        setTimeout(() => {
          msg.style.display = "none";
        }, 2000);
      });
    }
    
    // Permitir ejecutar con Enter (Ctrl+Enter o Cmd+Enter)
    document.getElementById("entrada").addEventListener("keydown", function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        generar();
      }
    });
  </script>

</body>
</html>
